apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-dev
  namespace: argocd
spec:
  sourceRepos:
    - https://github.com/Vinh5905/blog-gitops.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: blogapp-dev
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
      name: blogapp-dev
  namespaceResourceBlacklist:
    - group: '*'
      kind: '*'