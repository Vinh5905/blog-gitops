apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: blogapp-dev
  namespace: argocd
spec:
  sourceRepos:
    - https://github.com/Vinh5905/blog-gitops.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: blogapp-dev
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: ''
      kind: Service
    - group: ''
      kind: ConfigMap
    - group: ''
      kind: Secret
    - group: ''
      kind: ServiceAccount
    - group: argoproj.io
      kind: Rollout
    - group: argoproj.io
      kind: AnalysisTemplate
    - group: batch
      kind: Job
    - group: networking.k8s.io
      kind: Ingress
    - group: networking.k8s.io
      kind: NetworkPolicy