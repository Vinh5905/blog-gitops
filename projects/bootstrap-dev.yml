apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: bootstrap-dev
  namespace: argocd
spec:
  sourceRepos:
    - https://github.com/Vinh5905/blog-gitops.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: Application