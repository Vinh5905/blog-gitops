apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-storage-dev
  namespace: argocd
spec:
  project: storage-dev
  source:
    repoURL: https://kubernetes-sigs.github.io/aws-ebs-csi-driver
    chart: aws-ebs-csi-driver
    targetRevision: '2.68.0'
    helm:
      releaseName: aws-ebs-csi-driver
      skipTests: true
      valuesObject:
        controller:
          region: ap-southeast-1
          serviceAccount:
            create: true
            name: ebs-csi-controller-sa
          env:
            - name: AWS_ROLE_ARN
              value: arn:aws:iam::947856326077:role/blogapp-dev-ebs-csi
            - name: AWS_WEB_IDENTITY_TOKEN_FILE
              value: /var/run/blogapp-aws/token
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
          volumes:
            - name: aws-token
              projected:
                sources:
                  - serviceAccountToken:
                      path: token
                      audience: sts.amazonaws.com
                      expirationSeconds: 3600
          volumeMounts:
            - name: aws-token
              mountPath: /var/run/blogapp-aws
              readOnly: true
        node:
          enableWindows: false
          metadataSources: kubernetes
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system