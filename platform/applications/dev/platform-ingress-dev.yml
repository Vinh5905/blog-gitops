apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-ingress-dev
  namespace: argocd
spec:
  project: ingress-dev
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: '42.4.0'
    helm:
      skipCrds: true
      valuesObject:
        fullnameOverride: traefik
        deployment:
          replicas: 2
          healthchecksPort: 8000
        ingressClass:
          enabled: true
          isDefaultClass: false
          name: traefik
        api:
          dashboard: false
        providers:
          kubernetesCRD:
            enabled: false
          kubernetesIngress:
            enabled: true
            ingressClass: traefik
        service:
          spec:
            type: NodePort
            externalTrafficPolicy: Cluster
        ports:
          web:
            nodePort: 30080
          websecure:
            expose:
              default: false
        additionalArguments:
          - --ping.entryPoint=web
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    syncOptions:
      - CreateNamespace=true