apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-rollouts-dev
  namespace: argocd
spec:
  project: rollouts-dev
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-rollouts
    targetRevision: '2.43.11'
    helm:
      releaseName: argo-rollouts
      valuesObject:
        dashboard:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true